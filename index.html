<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CARNEVELE — Entrada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:#161716;font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
.intro{position:fixed;inset:0;display:grid;place-items:center;background:#fff}
.inner{width:min(100%,620px);height:100svh;min-height:560px;padding:8vh 28px 5vh;display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center}
.logoStage{align-self:end;margin-bottom:34px;perspective:900px}
.logoWrap{width:118px;aspect-ratio:1.15/1;display:grid;place-items:center;transform-style:preserve-3d;transition:transform .18s ease-out;will-change:transform;filter:drop-shadow(0 12px 18px rgba(0,0,0,.08))}
.logoWrap img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.nav{display:flex;flex-direction:column;align-items:center;gap:17px}
.nav a{position:relative;color:#171817;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;padding:4px 7px}
.nav a:after{content:"";position:absolute;left:50%;right:50%;bottom:0;height:1px;background:#171817;transition:.2s}
.nav a:hover:after,.nav a:focus-visible:after{left:7px;right:7px}
.social{align-self:end;display:flex;gap:13px;align-items:center;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.social a{width:20px;height:20px;display:grid;place-items:center;color:#aaa;text-decoration:none;transition:color .2s,transform .2s}
.social a:hover{color:#161716;transform:translateY(-2px)}
.social svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5}
.edition{position:fixed;left:18px;bottom:15px;font-size:6.5px;letter-spacing:1.5px;color:#c6c6c6;text-transform:uppercase}
.enter{animation:fadeIn .7s ease both}
.enter2{animation:fadeIn .7s .12s ease both}
.enter3{animation:fadeIn .7s .24s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:600px){
 .inner{padding:11vh 22px 6vh;min-height:100svh}
 .logoStage{margin-bottom:27px}
 .logoWrap{width:104px}
 .nav{gap:15px}
 .nav a{font-size:9.5px;letter-spacing:1.55px}
 .edition{display:none}
}
</style>
</head>

<script>
const logo=document.getElementById('logo3d');
function tilt(x,y){
  const rx=(0.5-y)*16;
  const ry=(x-0.5)*20;
  logo.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) translateZ(4px)`;
}
window.addEventListener('pointermove',e=>{
  tilt(e.clientX/window.innerWidth,e.clientY/window.innerHeight);
});
window.addEventListener('pointerleave',()=>{logo.style.transform='rotateX(0deg) rotateY(0deg)'});
window.addEventListener('deviceorientation',e=>{
  if(e.gamma==null||e.beta==null)return;
  const x=Math.max(-1,Math.min(1,e.gamma/35));
  const y=Math.max(-1,Math.min(1,(e.beta-45)/45));
  logo.style.transform=`rotateX(${-y*8}deg) rotateY(${x*12}deg)`;
});
</script>
